services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-easm-api
    ports:
      - "8080:8080"
    volumes:
      - db_data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/mini_asm.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
    driver: local
